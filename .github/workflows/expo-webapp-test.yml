name: Expo Webapp 진단
on:
  workflow_dispatch:
  push:
    paths:
      - 'expo/diag-trigger.txt'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      URL: https://script.google.com/macros/s/AKfycbymHbyntYlh4AfC1o4lW3GNQtZ9cm6-WxkKW-ehkjxtlcxxBi3nY3G84f_65XaRzfRIig/exec
    steps:
      - name: GET 헬스체크
        run: |
          echo "== GET $URL =="
          curl -sL -o /tmp/get.txt -w "HTTP %{http_code}\n" "$URL"
          head -c 1500 /tmp/get.txt; echo

      - name: POST 테스트 행 추가
        run: |
          echo "== POST =="
          curl -sL -o /tmp/post.txt -w "HTTP %{http_code}\n" \
            -H "Content-Type: text/plain;charset=utf-8" \
            -d '{"uuid":"gh-diag-001","receiptNo":"진단_001","ts":"2026-07-23 17:30:00","orderNo":"(진단테스트)","name":"진단봇","phone":"-","rName":"-","rPhone":"-","zipcode":"-","addr1":"-","addr2":"-","memo":"GitHub Actions 진단 행 - 삭제하세요","consent":"-","device":"CI"}' \
            "$URL"
          head -c 1500 /tmp/post.txt; echo
